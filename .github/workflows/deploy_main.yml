name: "[PRODUCTION] Deploy to GitHub Pages"

on:
  workflow_dispatch:
# Could also be ran everything something is pushed to main with:
# on:
#  push:
#    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    environment: github-pages
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # Otherwise checkout leaves an "AUTHORIZATION: basic <GITHUB_TOKEN>"
          # header configured for all of github.com. npm ci runs inside this
          # repo and would send it on every fetch, overriding the token in the
          # rewritten URL below — and GITHUB_TOKEN cannot see the private
          # registry, so the fetch comes back "Repository not found". Nothing
          # here pushes with git, so the credential is not needed after clone.
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      # @rethink-finance/positions-registry lives in a private repo and the
      # lockfile resolves it over SSH, which a runner has no key for. Rewrite
      # it to HTTPS carrying a read-only token so npm ci can fetch it.
      #
      # The token is the whole userinfo, with no username in front of it. An
      # `x-access-token:` prefix is the convention for GitHub App installation
      # tokens and a fine-grained PAT is rejected under it — git then reports
      # "Repository not found" rather than an auth error, because GitHub will
      # not confirm a private repo exists to a caller it does not recognise.
      - name: Authenticate private git dependencies
        run: |
          # Belt and braces alongside persist-credentials: false above — if any
          # step ever reintroduces the header, it silently wins over the URL.
          git config --local --unset-all http.https://github.com/.extraheader || true
          git config --global url."https://${REGISTRY_TOKEN}@github.com/".insteadOf "ssh://git@github.com/"
          git config --global --add url."https://${REGISTRY_TOKEN}@github.com/".insteadOf "git@github.com:"
          # Fail here rather than 90 seconds into npm ci with a misleading
          # "Repository not found".
          git ls-remote ssh://git@github.com/rethink-finance/permissions-registry.git >/dev/null
        env:
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Generate static site with env vars
        run: npx nuxi generate
        env:
          ENV_EXCLUDE_TEST_FUNDS: true
          BASE_DOMAIN: "app.rethink.finance"
          WALLET_CONNECT_PROJECT_ID: ${{ secrets.WALLET_CONNECT_PROJECT_ID }}
          BACKEND_URL: ${{ secrets.BACKEND_URL }}
          # Indexer
          GRAPH_BASE_URL: "https://api.studio.thegraph.com/query/"
          GRAPH_USERID: "96286"
          GRAPH_VERSION: "version/latest"
          # Zodiac Roles
          ZODIAC_GRAPH_BASE_URL: ${{ secrets.ZODIAC_GRAPH_BASE_URL }}
          ZODIAC_GRAPH_SEPOLIA: ${{ secrets.ZODIAC_GRAPH_SEPOLIA }}
          ZODIAC_GRAPH_GNOSIS_CHAIN: ${{ secrets.ZODIAC_GRAPH_GNOSIS_CHAIN }}
          ZODIAC_GRAPH_ETHEREUM: ${{ secrets.ZODIAC_GRAPH_ETHEREUM }}
          ZODIAC_GRAPH_POLYGON: ${{ secrets.ZODIAC_GRAPH_POLYGON }}
          ZODIAC_GRAPH_ARBITRUM: ${{ secrets.ZODIAC_GRAPH_ARBITRUM }}
          ZODIAC_GRAPH_OPTIMISM: ${{ secrets.ZODIAC_GRAPH_OPTIMISM }}
          ZODIAC_GRAPH_AVALANCHE: ${{ secrets.ZODIAC_GRAPH_AVALANCHE }}
          ZODIAC_GRAPH_BSC: ${{ secrets.ZODIAC_GRAPH_BSC }}
          ZODIAC_GRAPH_BASE: ${{ secrets.ZODIAC_GRAPH_BASE }}
          ETHERSCAN_KEY: ${{ secrets.ETHERSCAN_KEY }}
          ARBISCAN_KEY: ${{ secrets.ARBISCAN_KEY }}
          POLYGONSCAN_KEY: ${{ secrets.POLYGONSCAN_KEY }}
          BASESCAN_KEY: ${{ secrets.BASESCAN_KEY }}

      - name: Upload artifact for GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.output/public/'

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
